<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Potência</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 30px;
            text-align: center;
        }
        
        .bar-container {
            margin-bottom: 30px;
            background-color: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
        }
        
        .bar-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .bar-label {
            font-weight: bold;
            color: #44cc44;
        }
        
        .bar-values {
            color: #aaa;
        }
        
        .bar-bg {
            width: 100%;
            height: 40px;
            background-color: #404040;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }
        
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #44cc44, #66ff66);
            transition: width 0.5s ease, background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .bar-fill.warning {
            background: linear-gradient(90deg, #ffaa00, #ffcc44);
        }
        
        .bar-fill.danger {
            background: linear-gradient(90deg, #ff4444, #ff6666);
        }
        
        .bar-fill.full {
            background: linear-gradient(90deg, #cc0000, #ff0000);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
        }
        
        .status.loading {
            background-color: #444;
            color: #aaa;
        }
        
        .status.connected {
            background-color: #044804;
            color: #44cc44;
        }
        
        .status.error {
            background-color: #480404;
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Monitor de Potência</h1>
        
        <div class="bar-container">
            <div class="bar-info">
                <span class="bar-label">Potência Instantânea</span>
                <span class="bar-values">
                    <span id="currentPower">--</span> W / <span id="limitPower">--</span> W
                </span>
            </div>
            <div class="bar-bg">
                <div class="bar-fill" id="powerBar">
                    <span id="percentage">0%</span>
                </div>
            </div>
        </div>
        
        <div class="status loading" id="status">Conectando ao Firebase...</div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <script>
        // Configuração do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBTPR8X4dRg5fZu_PTj0hwud3bfHtky1S4",
            databaseURL: "https://powermanager-988cc-default-rtdb.firebaseio.com",
            projectId: "powermanager-988cc",
        };

        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const USER_ID = "VXOUd3jgCPTdGZrutzn6Sp9tlGO2";

        // Elementos do DOM
        const powerBar = document.getElementById('powerBar');
        const percentage = document.getElementById('percentage');
        const currentPower = document.getElementById('currentPower');
        const limitPower = document.getElementById('limitPower');
        const status = document.getElementById('status');

        let alertLimit = 100; // Valor padrão
        let currentPowerValue = 0;

        // Função para atualizar a barra
        function updateBar(current, limit) {
            const percent = (current / limit) * 100;
            const displayPercent = Math.min(percent, 100); // Limita a barra visualmente a 100%
            
            powerBar.style.width = displayPercent + '%';
            percentage.textContent = percent.toFixed(1) + '%'; // Mostra porcentagem real, mesmo acima de 100%
            currentPower.textContent = current;
            limitPower.textContent = limit;
            
            // Remover todas as classes
            powerBar.classList.remove('warning', 'danger', 'full');
            
            // Adicionar classe baseada na porcentagem
            if (percent >= 100) {
                powerBar.classList.add('full');
            } else if (percent >= 80) {
                powerBar.classList.add('danger');
            } else if (percent >= 60) {
                powerBar.classList.add('warning');
            }
        }

        // Buscar o limit do alerta
        function getAlertLimit() {
            const alertsRef = database.ref(`users/${USER_ID}/alerts`);
            
            alertsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (data) {
                    // Pegar o primeiro alerta e seu limit
                    const firstAlertKey = Object.keys(data)[0];
                    alertLimit = data[firstAlertKey].limit;
                    
                    console.log("Limit do alerta:", alertLimit);
                    updateBar(currentPowerValue, alertLimit);
                    
                    status.textContent = "✓ Conectado - Monitorando em tempo real";
                    status.className = "status connected";
                } else {
                    console.log("Nenhum alerta encontrado, usando limite padrão");
                    alertLimit = 100;
                    status.textContent = "⚠ Nenhum alerta cadastrado - Usando limite padrão (100W)";
                    status.className = "status error";
                }
            }, (error) => {
                console.error("Erro ao buscar limit:", error);
                status.textContent = "✗ Erro ao conectar: " + error.message;
                status.className = "status error";
            });
        }

        // Monitorar potência instantânea
        function monitorPower() {
            const powerRef = database.ref(`users/${USER_ID}/esp32/potencia_instantanea`);
            
            powerRef.on('value', (snapshot) => {
                currentPowerValue = snapshot.val() || 0;
                console.log("Potência atual:", currentPowerValue);
                updateBar(currentPowerValue, alertLimit);
            }, (error) => {
                console.error("Erro ao monitorar potência:", error);
                status.textContent = "✗ Erro na leitura de potência";
                status.className = "status error";
            });
        }

        // Iniciar monitoramento
        document.addEventListener('DOMContentLoaded', function() {
            console.log("Iniciando monitoramento...");
            getAlertLimit();
            monitorPower();
        });
    </script>
</body>
</html>
