<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Manager IoT</title>
    <link rel="stylesheet" href="style.css">
</head>
    
<body>
    <!-- Navbar -->
    <!-- Navbar -->
     
<nav class="navbar">
    <div class="nav-container">
        <div class="logo">
            <img src="img/iconsemfundo.png" alt="PowerManager Logo" class="logoicon">
            PowerManager
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="testebarra.html">Sobre</a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
        </ul>
        <div class="nav-right">
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Alternar tema">
                <span id="themeIcon">☀️</span>
            </button>
            <a href="login.html" class="login-btn">Login</a>
        </div>
    </div>
</nav>
<script>
    // ========== SISTEMA DE ALTERNÂNCIA DE TEMA ==========
    
    // Elementos do DOM
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');
    const body = document.body;

    // Verificar preferência salva no localStorage
    const savedTheme = localStorage.getItem('powerManagerTheme') || 'dark';
    
    // Aplicar tema salvo ao carregar a página
    body.className = savedTheme + '-mode';
    updateIcon(savedTheme);

    // Event listener para alternar tema ao clicar no botão
    themeToggle.addEventListener('click', () => {
        const currentTheme = body.classList.contains('dark-mode') ? 'dark' : 'light';
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        
        // Aplicar novo tema
        body.className = newTheme + '-mode';
        
        // Salvar preferência no localStorage
        localStorage.setItem('powerManagerTheme', newTheme);
        
        // Atualizar ícone
        updateIcon(newTheme);
        
        console.log('Tema alterado para:', newTheme);
    });

    // Função para atualizar o ícone do botão
    function updateIcon(theme) {
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    
    console.log('Sistema de tema inicializado - Tema atual:', savedTheme);
</script>
    <!-- Main Content -->
    <main class="main-container">
        <div class="geometric-bg">
            <div class="geometric-shpe shape-1"></div>
            <div class="geometric-shape shape-2"></div>
            <div class="geometric-shape shape-3"></div>
        </div>

        <div class="content-wrapper">
            <div class="text-content">
                <h1 class="main-title">
                    <span class="highlight">Power Manager</span><br>
                    IoT Today
                </h1>
                <p class="subtitle">
                    Bem-vindo ao nosso mundo de monitoramento inteligente e 
                    controle avançado de energia. Juntos, vamos embarcar em uma 
                    jornada notável onde a tecnologia IoT se torna realidade tangível.
                </p>
                <div class="cta-buttons">
                    <a href="#dashboard" class="btn-primary">
                        Ver Dashboard
                        <span>→</span>
                    </a>
                    <a href="#demo" class="btn-secondary">
                        Saiba Mais
                        <span>→</span>
                    </a>
                </div>
            </div>

            <div class="dashboard-container">
                <img src="img/dashboard1.png" alt="Dashboard Power Manager" class="dashimg">
            </div>
        </div>
    </main>
</body>
</html>
