<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Novas Funcionalidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bg-primary': '#0a0a0a',
                        'bg-secondary': '#1a1a1a',
                        'bg-card': '#1e1e1e',
                        'accent-green': '#00ff2a',
                        'accent-red': '#ef4444',
                        'border-dark': '#333333'
                    }
                }
            }
        }
    </script>
    <style>
        /* Animações customizadas */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }

        /* Estilo para o modal */
        .modal-backdrop {
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-bg-primary text-white font-sans p-8">
    
    <!-- Seção de Locais com Botão Adicionar -->
    <div class="mb-12">
        <h2 class="text-2xl font-semibold text-accent-green mb-6">Locais Monitorados</h2>
        
        <!-- Container de Locais -->
        <div class="flex gap-4 overflow-x-auto pb-2" id="locationsContainer">
            <!-- Locais serão adicionados aqui dinamicamente -->
            
            <!-- Botão Adicionar Local -->
            <div class="min-w-52 flex items-center justify-center">
                <button onclick="openLocationModal()" class="bg-bg-card border-2 border-dashed border-border-dark rounded-xl p-6 w-full h-full hover:border-accent-green hover:bg-green-500/5 transition-all duration-300 group">
                    <div class="text-center">
                        <div class="text-4xl mb-2 text-gray-500 group-hover:text-accent-green transition-colors">+</div>
                        <div class="font-semibold text-gray-400 group-hover:text-accent-green transition-colors">Adicionar Local</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Seção do Gráfico Aprimorado -->
    <div class="mb-12">
        <div class="bg-bg-card border border-border-dark rounded-xl p-6">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-lg font-semibold">Gráfico de Consumo Detalhado</h3>
                <div class="flex gap-2">
                    <button onclick="updateChart('day')" id="btnDay" class="px-4 py-2 text-sm border border-border-dark rounded text-gray-400 hover:bg-accent-green hover:text-black hover:border-accent-green transition-all">Dia</button>
                    <button onclick="updateChart('month')" id="btnMonth" class="px-4 py-2 text-sm bg-accent-green text-black rounded border border-accent-green">Mês</button>
                    <button onclick="updateChart('year')" id="btnYear" class="px-4 py-2 text-sm border border-border-dark rounded text-gray-400 hover:bg-accent-green hover:text-black hover:border-accent-green transition-all">Ano</button>
                </div>
            </div>
            
            <!-- Container do Gráfico -->
            <div class="relative h-96">
                <canvas id="consumptionChart"></canvas>
            </div>
            
            <!-- Estatísticas do Período -->
            <div class="grid grid-cols-3 gap-4 mt-6 pt-6 border-t border-border-dark">
                <div class="text-center">
                    <div class="text-2xl font-bold text-accent-green" id="totalConsumption">0 kWh</div>
                    <div class="text-sm text-gray-400">Consumo Total</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-yellow-400" id="averageConsumption">0 kWh</div>
                    <div class="text-sm text-gray-400">Média do Período</div>
                </div>
                <div class="text-center">
                    <div class="text-2xl font-bold text-blue-400" id="peakConsumption">0 kWh</div>
                    <div class="text-sm text-gray-400">Pico de Consumo</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Adicionar Local -->
    <div id="locationModal" class="fixed inset-0 bg-black bg-opacity-70 modal-backdrop hidden z-50 flex items-center justify-center">
        <div class="bg-bg-card border border-border-dark rounded-xl p-6 w-full max-w-md mx-4 transform transition-all">
            <h2 class="text-xl font-semibold text-accent-green mb-6">Adicionar Novo Local</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Nome do Local</label>
                    <input type="text" id="locationName" placeholder="Ex: São Paulo" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Custo Mensal (R$)</label>
                    <input type="number" id="locationCost" placeholder="Ex: 15000" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Consumo (kWh)</label>
                    <input type="number" id="locationConsumption" placeholder="Ex: 18000" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                </div>
                
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Emissão CO₂ (kg)</label>
                    <input type="number" id="locationEmission" placeholder="Ex: 200" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                </div>
            </div>
            
            <div class="flex gap-3 mt-6">
                <button onclick="closeLocationModal()" class="flex-1 px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg hover:bg-red-500/10 hover:border-accent-red transition-all">
                    Cancelar
                </button>
                <button type="button" onclick="addLocation()" class="flex-1 px-4 py-2 bg-accent-green text-black rounded-lg font-semibold hover:bg-green-400 transition-all">
                    Adicionar
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dados iniciais dos locais
        let locations = [
            { name: 'São Paulo', cost: 20408, consumption: 25500, emission: 200, active: true },
            { name: 'Rio Claro', cost: 15450, consumption: 18000, emission: 230, active: false },
            { name: 'Campinas', cost: 18350, consumption: 22100, emission: 380, active: false }
        ];

        // Renderizar locais iniciais
        function renderLocations() {
            const container = document.getElementById('locationsContainer');
            const addButton = container.querySelector('div:last-child');
            
            // Limpar container mantendo apenas o botão de adicionar
            while (container.firstChild && container.firstChild !== addButton) {
                container.removeChild(container.firstChild);
            }
            
            // Adicionar cada local
            locations.forEach((location, index) => {
                const locationDiv = document.createElement('div');
                locationDiv.className = `${location.active ? 'bg-green-500/10 border-2 border-accent-green' : 'bg-bg-card border border-border-dark'} rounded-xl p-6 min-w-52 cursor-pointer relative hover:transform hover:-translate-y-1 transition-all duration-300 slide-in`;
                locationDiv.innerHTML = `
                    <div class="absolute top-4 right-4 w-2 h-2 bg-accent-green rounded-full"></div>
                    <div class="font-semibold mb-2">${location.name}</div>
                    <div class="text-2xl font-bold text-accent-green mb-1">R$ ${location.cost.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</div>
                    <div class="text-sm text-gray-400">${location.consumption.toLocaleString('pt-BR')} kWh • ${location.emission} kg</div>
                `;
                locationDiv.onclick = () => setActiveLocation(index);
                container.insertBefore(locationDiv, addButton);
            });
        }

        // Definir local ativo
        function setActiveLocation(index) {
            locations = locations.map((loc, i) => ({ ...loc, active: i === index }));
            renderLocations();
        }

        // Modal functions
        function openLocationModal() {
            document.getElementById('locationModal').classList.remove('hidden');
        }

        function closeLocationModal() {
            document.getElementById('locationModal').classList.add('hidden');
            // Limpar campos
            document.getElementById('locationName').value = '';
            document.getElementById('locationCost').value = '';
            document.getElementById('locationConsumption').value = '';
            document.getElementById('locationEmission').value = '';
        }

        function addLocation() {
            const name = document.getElementById('locationName').value;
            const cost = parseFloat(document.getElementById('locationCost').value);
            const consumption = parseFloat(document.getElementById('locationConsumption').value);
            const emission = parseFloat(document.getElementById('locationEmission').value);
            
            if (name !== "" && !isNaN(cost) && !isNaN(consumption) && !isNaN(emission)) {
                locations.push({
                    name,
                    cost,
                    consumption,
                    emission,
                    active: false
                });
                renderLocations();
                closeLocationModal();
            } else {
                alert('Por favor, preencha todos os campos');
            }
        }

        // Configuração do Chart.js
        let chart;
        let currentView = 'month';

        // Dados para diferentes visualizações
        const chartData = {
            day: {
                labels: ['00h', '02h', '04h', '06h', '08h', '10h', '12h', '14h', '16h', '18h', '20h', '22h'],
                data: [450, 380, 320, 280, 520, 680, 890, 920, 850, 780, 650, 480],
                total: 7700,
                average: 641,
                peak: 920
            },
            month: {
                labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
                data: [18500, 17200, 19800, 21000, 22500, 24800, 26200, 25500, 23800, 22100, 20400, 19200],
                total: 261000,
                average: 21750,
                peak: 26200
            },
            year: {
                labels: ['2019', '2020', '2021', '2022', '2023', '2024'],
                data: [180000, 195000, 210000, 235000, 248000, 261000],
                total: 1329000,
                average: 221500,
                peak: 261000
            }
        };

        function initChart() {
            const ctx = document.getElementById('consumptionChart').getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, 'rgba(0, 255, 42, 0.3)');
            gradient.addColorStop(1, 'rgba(0, 255, 42, 0.01)');

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: chartData.month.labels,
                    datasets: [{
                        label: 'Consumo (kWh)',
                        data: chartData.month.data,
                        borderColor: '#00ff2a',
                        backgroundColor: gradient,
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        pointBackgroundColor: '#00ff2a',
                        pointBorderColor: '#0a0a0a',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        },
                        tooltip: {
                            backgroundColor: '#1e1e1e',
                            titleColor: '#00ff2a',
                            bodyColor: '#ffffff',
                            borderColor: '#333333',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return `Consumo: ${context.parsed.y.toLocaleString('pt-BR')} kWh`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: '#333333',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#888888'
                            }
                        },
                        y: {
                            grid: {
                                color: '#333333',
                                drawBorder: false
                            },
                            ticks: {
                                color: '#888888',
                                callback: function(value) {
                                    return value.toLocaleString('pt-BR') + ' kWh';
                                }
                            }
                        }
                    },
                    interaction: {
                        intersect: false,
                        mode: 'index'
                    }
                }
            });

            updateStats('month');
        }

        function updateChart(view) {
            currentView = view;
            
            // Atualizar botões
            document.querySelectorAll('#btnDay, #btnMonth, #btnYear').forEach(btn => {
                btn.classList.remove('bg-accent-green', 'text-black', 'border-accent-green');
                btn.classList.add('border-border-dark', 'text-gray-400');
            });
            
            const activeBtn = document.getElementById('btn' + view.charAt(0).toUpperCase() + view.slice(1));
            activeBtn.classList.remove('border-border-dark', 'text-gray-400');
            activeBtn.classList.add('bg-accent-green', 'text-black', 'border-accent-green');
            
            // Atualizar dados do gráfico
            chart.data.labels = chartData[view].labels;
            chart.data.datasets[0].data = chartData[view].data;
            
            // Ajustar tipo de gráfico baseado na visualização
            if (view === 'day') {
                chart.config.type = 'line';
                chart.data.datasets[0].tension = 0.4;
                chart.data.datasets[0].fill = true;
            } else if (view === 'month') {
                chart.config.type = 'bar';
                chart.data.datasets[0].backgroundColor = '#00ff2a';
                chart.data.datasets[0].borderRadius = 4;
            } else {
                chart.config.type = 'line';
                chart.data.datasets[0].tension = 0.2;
                chart.data.datasets[0].fill = true;
            }
            
            chart.update('active');
            updateStats(view);
        }

        function updateStats(view) {
            document.getElementById('totalConsumption').textContent = chartData[view].total.toLocaleString('pt-BR') + ' kWh';
            document.getElementById('averageConsumption').textContent = chartData[view].average.toLocaleString('pt-BR') + ' kWh';
            document.getElementById('peakConsumption').textContent = chartData[view].peak.toLocaleString('pt-BR') + ' kWh';
        }

        // Inicializar ao carregar a página
        document.addEventListener('DOMContentLoaded', function() {
            renderLocations();
            initChart();
        });

        // Fechar modal ao clicar fora
        document.getElementById('locationModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeLocationModal();
            }
        });
    </script>
</body>
</html>
