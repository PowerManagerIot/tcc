<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.js"></script>
    <link rel="stylesheet" href="stylerl.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/> 
</head>
<body class="bg-bg-primary text-white font-sans p-8">

    <div class="fixed left-0 top-0 w-20 hover:w-64 h-full bg-bg-secondary border-r border-border-dark z-50 transition-all duration-300 ease-in-out group">
        <div class="p-4">
            <!-- Logo -->
            <div class="flex items-center gap-3 mb-8">
                <a href="index.html" class="w-10 h-10 object-contain flex-shrink-0"><img src="img/iconsemfundo.png" alt="Power Manager Logo"></a>
                <a href="index.html" class="font-bold text-lg opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap"><h3 >Power Manager</h3></a>
            </div>
            
            <!-- Navigation -->
            <nav>
                <ul class="space-y-4">
                    <li>
                        <a href="dashboard.html" class="flex items-center py-3 px-2 text-gray-400 hover:text-accent-green hover:bg-green-500/10 rounded-lg transition-all duration-300 group-hover:px-4">
                            <span class="text-xl flex-shrink-0"><i class="ph ph-chart-bar"></i></span>
                            <span class="ml-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="relatorio.html" class="flex items-center py-3 px-2 text-accent-green bg-green-500/10 rounded-lg border-2 border-accent-green group-hover:px-4 transition-all duration-300">
                            <span class="text-xl flex-shrink-0"><i class="ph ph-chart-line"></i></span>
                            <span class="ml-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Relatórios</span>
                        </a>
                    </li>
                    <li>
                        <a href="alerta.html" class="flex items-center py-3 px-2 text-gray-400 hover:text-accent-green hover:bg-green-500/10 rounded-lg transition-all duration-300 group-hover:px-4">
                            <span class="text-xl flex-shrink-0"><i class="ph ph-bell-ringing"></i></span>
                            <span class="ml-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300 whitespace-nowrap">Alertas</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="ml-20 h-screen transition-all duration-300 ease-in-out">

        <div class="mb-8">
            <button onclick="openLocationModal()">            
                <div class="fixed top-8 right-8 border border-border-dark rounded-lg px-4 py-3 flex items-center gap-2 connection-status register-btn" id="connectionStatus">
                    <i class="ph ph-plus"></i><span class="text-sm">Crie um alerta</span>
                </div>
            </button>
        </div>

        <!-- Modal para Adicionar Local -->
        <div id="locationModal" class="fixed inset-0 bg-black bg-opacity-70 modal-backdrop hidden z-50 flex items-center justify-center">
            <div class="bg-bg-card border border-border-dark rounded-xl p-6 w-full max-w-md mx-4 transform transition-all">
                <h2 class="text-xl font-semibold text-accent-green mb-6">Crie um alerta</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Nome do Alerta</label>
                        <input type="text" id="locationName" placeholder="Ex: Alto consumo!" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Tipo do Alerta (R$)</label>
                        <input type="number" id="locationCost" placeholder="Ex: Notificação ou Automação" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                    </div>
                    
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Valor para disparo (kW)</label>
                        <input type="number" id="locationConsumption" placeholder="Ex: 18000" class="w-full px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg text-white focus:border-accent-green focus:outline-none transition-colors">
                    </div>
                </div>
                
                <div class="flex gap-3 mt-6">
                    <button onclick="closeLocationModal()" class="flex-1 px-4 py-2 bg-bg-secondary border border-border-dark rounded-lg hover:bg-red-500/10 hover:border-accent-red transition-all">
                        Cancelar
                    </button>
                    <button onclick="addLocation()" class="flex-1 px-4 py-2 bg-accent-green text-black rounded-lg font-semibold hover:bg-green-400 transition-all">
                        Criar
                    </button>
                </div>
            </div>
        </div>
    
        <!-- Seção de Locais com Botão Adicionar -->
        <div class="mb-12">
            <h2 class="text-2xl font-semibold text-accent-green mb-6">Relatórios</h2>
            
            <!-- Container de Locais -->
            <div class="flex gap-4 overflow-x-auto pb-2" id="locationsContainer">
                <!-- Locais serão adicionados aqui dinamicamente -->
            

                <div class="flex gap-4 overflow-x-auto pb-2" id="locationsContainer">
                    <!-- Locais serão adicionados aqui dinamicamente -->
                    
                    <!-- Botão Adicionar Local -->
                    <div class="min-w-52 flex items-center justify-center">
                        <button onclick="openLocationModal()" class="bg-bg-card border-2 border-dashed border-border-dark rounded-xl p-6 w-full h-full hover:border-accent-green hover:bg-green-500/5 transition-all duration-300 group">
                            <div class="text-center">
                                <div class="text-4xl mb-2 text-gray-500 group-hover:text-accent-green transition-colors">+</div>
                                <div class="font-semibold text-gray-400 group-hover:text-accent-green transition-colors">Gerar Relatório</div>
                            </div>
                        </button>
                    </div>
                </div>

            </div>
        </div>

        <!-- Seção do Gráfico Aprimorado -->
        <div class="mb-12">
            <div class="bg-bg-card border border-border-dark rounded-xl p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-semibold">Gráfico de Consumo Detalhado</h3>
                    <div class="flex gap-2">
                        <button onclick="updateChart('day')" id="btnDay" class="px-4 py-2 text-sm border border-border-dark rounded text-gray-400 hover:bg-accent-green hover:text-black hover:border-accent-green transition-all">Dia</button>
                        <button onclick="updateChart('month')" id="btnMonth" class="px-4 py-2 text-sm bg-accent-green text-black rounded border border-accent-green">Mês</button>
                        <button onclick="updateChart('year')" id="btnYear" class="px-4 py-2 text-sm border border-border-dark rounded text-gray-400 hover:bg-accent-green hover:text-black hover:border-accent-green transition-all">Ano</button>
                    </div>
                </div>
                
                <!-- Container do Gráfico -->
                <div class="relative h-96">
                    <canvas id="consumptionChart"></canvas>
                </div>
                
                <!-- Estatísticas do Período -->
                <div class="grid grid-cols-3 gap-4 mt-6 pt-6 border-t border-border-dark">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-accent-green" id="totalConsumption">0 kWh</div>
                        <div class="text-sm text-gray-400">Consumo Total</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-yellow-400" id="averageConsumption">0 kWh</div>
                        <div class="text-sm text-gray-400">Média do Período</div>
                    </div>
                    <div class="text-center">
                        <div class="text-2xl font-bold text-blue-400" id="peakConsumption">0 kWh</div>
                        <div class="text-sm text-gray-400">Pico de Consumo</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="scriptrl.js"></script>
</body>
</html>
